<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>เมนูลับ ITS Lab Admin - Multi-Design Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'Prompt', 'sans-serif'] 
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        button, select, input, textarea { min-height: 44px; }
        .chip-btn, nav button, header button { min-height: unset !important; }
        .chip-btn { min-height: 36px !important; }
        
        /* Hide Scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Focus styles for cards (Optimized for Mobile, No dull grayscale) */
        .focus-card-active { z-index: 10; box-shadow: 0 12px 28px -4px rgba(236, 72, 153, 0.18), 0 6px 12px -4px rgba(0, 0, 0, 0.05); border-color: #ec4899; }
        .focus-card-inactive { border-color: #e2e8f0; opacity: 1; }
        .focus-card-inactive:hover { border-color: #cbd5e1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-full flex flex-col antialiased">

    <!-- Top Navigation Header -->
    <header role="banner" class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Brand / Secret Menu Badge -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-purple-700 via-indigo-800 to-slate-900 text-white rounded-xl flex items-center justify-center font-bold text-base shadow-sm relative">
                    <i class="fa-solid fa-user-secret"></i>
                    <span class="absolute -top-1 -right-1 flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-pink-500"></span>
                    </span>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-sm font-bold text-slate-900 leading-tight">ITS Lab Admin</h1>
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300">
                            <i class="fa-solid fa-key text-[9px]"></i> เมนูลับ
                        </span>
                    </div>
                    <p class="text-xs text-slate-500">Backoffice Secret Tools & Dev Hub</p>
                </div>
            </div>

            <!-- Quick Navigation to Other Systems & Desktop Switcher -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Links to other pages -->
                <div class="hidden md:flex items-center gap-1.5 border-r border-slate-200 pr-3 mr-1 text-xs font-semibold">
                    <a href="index.html" class="px-3 py-2 rounded-xl text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition flex items-center gap-1.5 font-bold">
                        <i class="fa-solid fa-shapes text-indigo-600"></i>
                        <span>ศูนย์รวมดีไซน์ (21 แบบ)</span>
                    </a>
                    <a href="staff-management.html" class="px-3 py-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-users text-slate-500"></i>
                        <span>จัดการเจ้าหน้าที่</span>
                    </a>
                    <a href="reset-otp.html" class="px-3 py-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-mobile-screen text-slate-500"></i>
                        <span>ตั้งค่า OTP</span>
                    </a>
                </div>

                <!-- Desktop Design Switcher -->
                <nav aria-label="Design Switcher" class="hidden xl:flex items-center bg-slate-100 p-1.5 rounded-2xl border border-slate-200 text-xs font-semibold gap-1">
                    <button onclick="switchDesign(1)" id="btn-1" class="px-3 py-2 rounded-xl transition flex items-center space-x-2 bg-white text-slate-900 shadow-sm font-bold border border-slate-200">
                        <i class="fa-solid fa-columns text-slate-700"></i><span>1. Master</span>
                    </button>
                    <button onclick="switchDesign(2)" id="btn-2" class="px-3 py-2 rounded-xl transition flex items-center space-x-2 text-slate-600 hover:text-slate-900 border border-transparent">
                        <i class="fa-solid fa-rocket text-teal-600"></i><span>2. Launchpad</span>
                    </button>
                    <button onclick="switchDesign(3)" id="btn-3" class="px-3 py-2 rounded-xl transition flex items-center space-x-2 text-slate-600 hover:text-slate-900 border border-transparent">
                        <i class="fa-solid fa-folder-tree text-amber-600"></i><span>3. Category Hub</span>
                    </button>
                    <button onclick="switchDesign(4)" id="btn-4" class="px-3 py-2 rounded-xl transition flex items-center space-x-2 text-slate-600 hover:text-slate-900 border border-transparent">
                        <i class="fa-solid fa-bolt text-indigo-600"></i><span>4. Palette</span>
                    </button>
                    <button onclick="switchDesign(5)" id="btn-5" class="px-3 py-2 rounded-xl transition flex items-center space-x-2 text-slate-600 hover:text-slate-900 border border-transparent">
                        <i class="fa-solid fa-layer-group text-pink-600"></i><span>5. Focus Stack</span>
                    </button>
                </nav>
            </div>
        </div>

        <!-- Mobile Quick Switcher Bar -->
        <div class="xl:hidden px-4 py-2.5 bg-slate-100 border-t border-slate-200 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar text-xs">
            <div class="flex space-x-1.5">
                <button onclick="switchDesign(1)" id="mb-1" class="px-3.5 py-1.5 bg-white rounded-xl font-bold text-slate-900 shadow-sm whitespace-nowrap border border-slate-200">1. Master</button>
                <button onclick="switchDesign(2)" id="mb-2" class="px-3.5 py-1.5 bg-slate-200/50 rounded-xl font-medium text-slate-600 whitespace-nowrap">2. Launchpad</button>
                <button onclick="switchDesign(3)" id="mb-3" class="px-3.5 py-1.5 bg-slate-200/50 rounded-xl font-medium text-slate-600 whitespace-nowrap">3. Category Hub</button>
                <button onclick="switchDesign(4)" id="mb-4" class="px-3.5 py-1.5 bg-slate-200/50 rounded-xl font-medium text-slate-600 whitespace-nowrap">4. Palette</button>
                <button onclick="switchDesign(5)" id="mb-5" class="px-3.5 py-1.5 bg-slate-200/50 rounded-xl font-medium text-slate-600 whitespace-nowrap">5. Focus Stack</button>
            </div>
            <div class="flex items-center gap-1 pl-2 border-l border-slate-200 whitespace-nowrap">
                <a href="index.html" class="px-2.5 py-1.5 bg-indigo-50 text-indigo-700 rounded-lg font-bold text-[11px] shadow-xs">🏛️ ดีไซน์ทั้งหมด</a>
                <a href="staff-management.html" class="px-2.5 py-1.5 bg-white/80 rounded-lg text-slate-600 font-semibold text-[11px] shadow-xs">👥 เจ้าหน้าที่</a>
                <a href="reset-otp.html" class="px-2.5 py-1.5 bg-white/80 rounded-lg text-slate-600 font-semibold text-[11px] shadow-xs">🔓 OTP</a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col relative">
        <!-- Rendered dynamically -->
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 left-6 sm:left-auto bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl transform translate-y-32 opacity-0 transition-all duration-300 z-[100] text-sm flex items-center space-x-3 border border-slate-800">
        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toast-message" class="font-medium">ดำเนินการสำเร็จ</span>
    </div>

    <script>
        const tools = [
            { id: 1, title: "1. สร้างหน่วยงานบัญชีทางการ", desc: "เปิดหน่วยงานใหม่ที่เป็นทางการ ปักหมุดพิกัด และระบบสร้าง QR Code พร้อมสุ่มรหัส Admin/Staff ให้อัตโนมัติ", category: "Org Management", icon: "fa-building-shield", fields: [ { name: "name", label: "ชื่อหน่วยงาน", type: "text", placeholder: "เช่น เทศบาลนคร...", required: true }, { name: "province", label: "จังหวัดที่ตั้ง", type: "select", options: ["กรุงเทพมหานคร", "เชียงใหม่", "ขอนแก่น", "ภูเก็ต"] }, { name: "latlon", label: "พิกัด (Lat,Lon)", type: "text", placeholder: "13.0,100.0" }, { name: "isClaim", label: "สร้างรหัส admin & staff อัตโนมัติ", type: "checkbox", default: true } ] },
            { id: 2, title: "2. ดู/แก้ไข ข้อมูลหน่วยงาน และสิทธิ์ (Flags)", desc: "ค้นหาหน่วยงานเพื่อเปิด-ปิดฟีเจอร์หรือสิทธิ์พิเศษ เช่น สิทธิ์ใช้ AI, แผนที่สาธารณะ หรือแก้ไขพิกัดพื้นที่ดูแล", category: "Org Management", icon: "fa-sliders", fields: [ { name: "name", label: "ชื่อหน่วยงาน", type: "text", placeholder: "ใช้ % ค้นหาบางส่วน เช่น อบต.%" }, { name: "org_id", label: "หมายเลขหน่วยงาน (org_id)", type: "number", placeholder: "เช่น 1234" } ] },
            { id: 3, title: "3. ดู/สร้าง รหัสขอเป็น admin/staff", desc: "ค้นหารหัส Claim Code เดิม หรือกดสุ่มสร้างรหัสชุดใหม่ (Re-generate) เพื่อยกเลิกรหัสเก่าทันทีเมื่อรหัสหลุด", category: "Org Management", icon: "fa-key", fields: [ { name: "org_id", label: "หมายเลขหน่วยงาน (org_id)", type: "number", placeholder: "เช่น 1234", required: true } ] },
            { id: 4, title: "4. อัปเดต QR code", desc: "สร้างรูปภาพ QR Code ประจำหน่วยงานขึ้นมาใหม่และอัปเดตบนคลาวด์ กรณี QR Code เดิมเสียหรือมีการย้ายพิกัด", category: "Org Management", icon: "fa-qrcode", fields: [ { name: "org_id", label: "หมายเลขหน่วยงาน (org_id)", type: "number", placeholder: "เช่น 1234", required: true } ] },
            { id: 5, title: "5. สร้างหน่วยงานตามผังองค์กร (Hierarchy)", desc: "ผูกโครงสร้างสายบังคับบัญชา (แม่-ลูก) เพื่อให้เรื่องร้องเรียนไหลอัตโนมัติ และกดดูผังองค์กรได้", category: "Org Management", icon: "fa-sitemap", fields: [ { name: "tag", label: "ชื่อของสาย hierarchy", type: "text", placeholder: "{bfmcc}" }, { name: "pathlist", label: "กรอก path ของหน่วยงาน", type: "textarea", placeholder: "1\n1.2" } ] },
            { id: 6, title: "6. เปลี่ยนสถานะโพสต์เป็น เสร็จสิ้น/ไม่เกี่ยวข้อง", desc: "เครื่องมือฉุกเฉินสำหรับ 'ซ่อมเคส' ที่สถานะค้างหรือผิดพลาด บังคับปิดเคสเปลี่ยนสถานะทันที", category: "Ticket Repair", icon: "fa-triangle-exclamation", fields: [ { name: "ticket_id", label: "Ticket ID", type: "text", placeholder: "2026-XXXXXX", required: true }, { name: "state_type", label: "เปลี่ยนเป็นสถานะ", type: "select", options: ["เสร็จสิ้น", "ไม่เกี่ยวข้อง"] } ] },
            { id: 7, title: "7. ดูรายละเอียดของการแจ้ง", desc: "ส่องข้อมูลเชิงลึกและประวัติลับของเรื่องร้องเรียน ค้นหาด้วย Ticket ID เพื่อดูไทม์ไลน์ดิบทั้งหมด", category: "Ticket Repair", icon: "fa-magnifying-glass-chart", fields: [ { name: "ticket_id", label: "Ticket ID", type: "text", placeholder: "2026-XXXXXX", required: true } ] },
            { id: 8, title: "8. ดาวน์โหลดไฟล์ CSV", desc: "Export ข้อมูลเรื่องร้องเรียนทั้งหมดของระบบออกมาเป็นไฟล์ CSV สำหรับทีมหลังบ้านทำสถิติ", category: "Data & Analytics", icon: "fa-file-csv", fields: [] },
            { id: 9, title: "9. คำนวณคะแนนคุณภาพประเมิน กทม.", desc: "ประมวลผลดัชนีคะแนน KPI การทำงานของ กทม. 50 เขต ออกมาเป็นไฟล์ตาราง CSV หรือ JSON", category: "Data & Analytics", icon: "fa-chart-pie", fields: [ { name: "output", label: "รูปแบบไฟล์ผลลัพธ์", type: "select", options: ["json", "csv"] } ] },
            { id: 10, title: "10. Cloud Dashboard", desc: "มอนิเตอร์ดูความเสถียรของ Chatbot Traffy Fondue แบบ Real-time", category: "Data & Analytics", icon: "fa-cloud", isLink: true, linkUrl: "https://console.cloud.google.com/monitoring", fields: [] },
            { id: 11, title: "11. ดู/เพิ่มสถานะพิเศษ (State Config)", desc: "สร้างขั้นตอนการทำงาน (Workflow/Status) พิเศษเฉพาะหน่วยงาน เช่น 'รออะไหล่'", category: "Org Management", icon: "fa-list-check", fields: [ { name: "org_id", label: "หมายเลขหน่วยงาน (org_id)", type: "number", placeholder: "เช่น 1234", required: true } ] }
        ];

        let currentDesign = 1;
        let currentToolId = 1;
        
        let d1_viewMode = 'list'; 
        let d2_viewMode = 'grid'; 
        let d3_viewMode = 'list'; 
        let d3_activeCategory = 'All'; 
        let d4_viewMode = 'palette'; 

        function switchDesign(design) {
            currentDesign = design;
            d1_viewMode = 'list';
            d2_viewMode = 'grid';
            d3_viewMode = 'list';
            d4_viewMode = 'palette';
            
            // Design 5 starts in clean collapsed state for best mobile UX
            if (design === 5) {
                currentToolId = null;
            } else if (!currentToolId) {
                currentToolId = 1;
            }
            
            [1, 2, 3, 4, 5].forEach(d => {
                const btn = document.getElementById(`btn-${d}`);
                const mb = document.getElementById(`mb-${d}`);
                if (btn) {
                    if (d === design) {
                        btn.className = `px-3 py-2 rounded-xl transition flex items-center space-x-2 bg-white text-slate-900 shadow-sm font-bold border border-slate-200`;
                    } else {
                        btn.className = "px-3 py-2 rounded-xl transition flex items-center space-x-2 text-slate-600 hover:text-slate-900 border border-transparent";
                    }
                }
                if (mb) {
                    if (d === design) {
                        mb.className = "px-3.5 py-1.5 bg-white rounded-xl font-bold text-slate-900 shadow-sm whitespace-nowrap border border-slate-200";
                    } else {
                        mb.className = "px-3.5 py-1.5 bg-slate-200/50 rounded-xl font-medium text-slate-600 whitespace-nowrap border border-transparent";
                    }
                }
            });
            renderApp();
        }

        function renderApp() {
            const container = document.getElementById('app-container');
            if(!container) return;
            container.innerHTML = '';
            container.className = "flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col relative animate-fade-in";

            if (currentDesign === 1) renderDesign1(container);
            else if (currentDesign === 2) renderDesign2(container);
            else if (currentDesign === 3) renderDesign3(container);
            else if (currentDesign === 4) renderDesign4(container);
            else if (currentDesign === 5) renderDesign5(container);
        }

        /* -------------------------------------------------------------------------
           DESIGN 1: Master-Detail (Desktop & Mobile Adaptive)
           ------------------------------------------------------------------------- */
        function renderDesign1(container) {
            const tool = tools.find(t => t.id === currentToolId) || tools[0];
            const isMobile = window.innerWidth < 1024;

            container.innerHTML = `
                <div class="flex flex-col lg:flex-row gap-6 h-full">
                    <aside class="w-full lg:w-80 flex-shrink-0 ${isMobile && d1_viewMode === 'form' ? 'hidden' : 'block'}">
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 lg:sticky lg:top-24">
                            <div class="flex items-center justify-between px-3 py-2 border-b border-slate-100 mb-2">
                                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">เมนูจัดการระบบ</h2>
                                <span class="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-full">${tools.length} เครื่องมือ</span>
                            </div>
                            <nav class="space-y-1">
                                ${tools.map(t => `
                                    <button onclick="d1_selectTool(${t.id})" class="w-full text-left px-3.5 py-3 rounded-xl text-sm font-medium transition flex items-center space-x-3 ${t.id === currentToolId && !isMobile ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100'}">
                                        <i class="fa-solid ${t.icon} w-5 text-center ${t.id === currentToolId && !isMobile ? 'text-white' : 'text-slate-400'}"></i>
                                        <span class="truncate">${t.title}</span>
                                    </button>
                                `).join('')}
                            </nav>
                        </div>
                    </aside>
                    <main class="flex-1 ${isMobile && d1_viewMode === 'list' ? 'hidden' : 'block'}">
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-8 animate-pop-in">
                            ${isMobile ? `
                            <div class="mb-5 pb-4 border-b border-slate-100">
                                <button onclick="d1_backToList()" class="inline-flex items-center text-sm font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 px-4 py-2.5 rounded-xl transition">
                                    <i class="fa-solid fa-arrow-left mr-2"></i> กลับไปหน้ารายการเมนู
                                </button>
                            </div>` : ''}
                            <div class="border-b border-slate-100 pb-5 mb-6">
                                <span class="inline-block px-3 py-1 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg mb-2">${tool.category}</span>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900">${tool.title}</h2>
                                <p class="text-sm text-slate-500 mt-1 leading-relaxed">${tool.desc}</p>
                            </div>
                            <div id="form-container-d1"></div>
                            ${generateResultBox('d1')}
                        </div>
                    </main>
                </div>
            `;
            if (!isMobile || d1_viewMode === 'form') {
                renderFormFields('form-container-d1', tool, 'slate', 'd1');
            }
        }
        function d1_selectTool(id) { currentToolId = id; d1_viewMode = 'form'; renderApp(); }
        function d1_backToList() { d1_viewMode = 'list'; renderApp(); }

        /* -------------------------------------------------------------------------
           DESIGN 2: Mobile Launchpad (App Grid & Smooth Transition)
           ------------------------------------------------------------------------- */
        function renderDesign2(container) {
            if (d2_viewMode === 'grid') {
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto w-full space-y-8 animate-fade-in">
                        <div class="text-center px-4">
                            <span class="bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Design 2: App Launchpad</span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-3 mb-2">หน้าจอแอปมือถือ (Launchpad)</h2>
                            <p class="text-sm text-slate-600 max-w-lg mx-auto">แตะที่ไอคอนเพื่อสลับเข้าสู่หน้าต่างการทำงานเต็มจอ พร้อมปุ่มย้อนกลับ</p>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6 px-2">
                            ${tools.map(t => `
                                <button onclick="d2_select(${t.id})" class="group flex flex-col items-center p-5 bg-white rounded-3xl shadow-sm border border-slate-100 hover:shadow-md hover:border-teal-200 transition-all cursor-pointer">

        /* -------------------------------------------------------------------------

           ------------------------------------------------------------------------- */
        function renderFormFields(containerId, tool, themeColor, prefix) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const ringColors = { slate: 'focus:ring-slate-900', teal: 'focus:ring-teal-500', amber: 'focus:ring-amber-500', indigo: 'focus:ring-indigo-500', pink: 'focus:ring-pink-500' };
            const bgColors = { slate: 'bg-slate-900 hover:bg-slate-800', teal: 'bg-teal-600 hover:bg-teal-700', amber: 'bg-amber-500 hover:bg-amber-600', indigo: 'bg-indigo-600 hover:bg-indigo-700', pink: 'bg-pink-600 hover:bg-pink-700' };
            
            const ringColor = ringColors[themeColor] || ringColors.slate;
            const bgColor = bgColors[themeColor] || bgColors.slate;

            if (tool.isLink) {
                container.innerHTML = `
                    <div class="py-8 text-center space-y-4 bg-slate-50 rounded-2xl border border-slate-100 p-6">
                        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-inner">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <p class="text-sm font-medium text-slate-700">ลิงก์ตรงสู่ระบบ Google Cloud Monitoring Dashboard</p>
                        <a href="${tool.linkUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-2 ${bgColor} text-white px-6 py-3.5 rounded-xl font-bold text-sm transition shadow-sm">
                            <span>เปิดหน้าต่าง Cloud Monitoring</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
                        </a>
                    </div>
                `;
                return;
            }

            if (tool.fields.length === 0) {
                const btn = document.createElement('button');
                btn.className = `w-full ${bgColor} py-3.5 rounded-xl font-bold text-sm text-white transition shadow-sm flex items-center justify-center space-x-2`;
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i><span>ดำเนินการประมวลผลทันที</span>`;
                btn.onclick = () => executeAction(tool, {}, prefix);
                container.appendChild(btn);
                return;
            }

            const form = document.createElement('form');
            form.className = "space-y-4";
            form.onsubmit = (e) => {
                e.preventDefault();
                const formData = {};
                tool.fields.forEach(f => {
                    const el = document.getElementById(`f_${prefix}_${f.name}`);
                    if (el) {
                        formData[f.name] = f.type === 'checkbox' ? el.checked : el.value;
                    }
                });
                executeAction(tool, formData, prefix);
            };

            tool.fields.forEach(field => {
                const group = document.createElement('div');
                group.className = "space-y-1.5";
                
                if (field.type === 'checkbox') {
                    group.className = "flex items-center space-x-3 py-2";
                    group.innerHTML = `
                        <input type="checkbox" id="f_${prefix}_${field.name}" ${field.default ? 'checked' : ''} class="w-5 h-5 text-slate-900 border-slate-300 rounded focus:ring-2 ${ringColor} cursor-pointer">
                        <label for="f_${prefix}_${field.name}" class="text-sm font-bold text-slate-900 cursor-pointer">${field.label}</label>
                    `;
                } else {
                    let inputHtml = '';
                    if (field.type === 'select') {
                        inputHtml = `<select id="f_${prefix}_${field.name}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent ${ringColor}">${field.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
                    } else if (field.type === 'textarea') {
                        inputHtml = `<textarea id="f_${prefix}_${field.name}" rows="3" placeholder="${field.placeholder || ''}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent ${ringColor} font-mono placeholder:text-slate-400"></textarea>`;
                    } else {
                        inputHtml = `<input type="${field.type}" id="f_${prefix}_${field.name}" placeholder="${field.placeholder || ''}" ${field.required ? 'required' : ''} class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent ${ringColor} placeholder:text-slate-400">`;
                    }
                    group.innerHTML = `<label for="f_${prefix}_${field.name}" class="block text-xs font-bold text-slate-700">${field.label}${field.required ? ' <span class="text-rose-500">*</span>' : ''}</label>${inputHtml}`;
                }
                form.appendChild(group);
            });

            const submitBtn = document.createElement('button');
            submitBtn.type = "submit";
            submitBtn.className = `w-full ${bgColor} text-white py-3.5 rounded-xl font-bold text-sm transition shadow-md flex items-center justify-center space-x-2 mt-6 focus:ring-4 focus:ring-opacity-50 ${ringColor}`;
            submitBtn.innerHTML = `<i class="fa-solid fa-bolt"></i><span>ดำเนินการประมวลผล</span>`;
            form.appendChild(submitBtn);

            container.appendChild(form);
        }

        function generateResultBox(prefix) {
            return `
                <div id="result-box-${prefix}" class="mt-6 hidden animate-slide-up">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-slate-500 flex items-center gap-2 uppercase tracking-wider"><i class="fa-solid fa-terminal text-slate-400"></i> ผลลัพธ์การทำงาน (Console Response)</span>
                        <button type="button" onclick="copyOutput('${prefix}')" class="text-xs font-semibold text-slate-600 bg-white hover:bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-400"><i class="fa-regular fa-copy mr-1"></i> คัดลอก JSON</button>
                    </div>
                    <pre id="output-pre-${prefix}" class="bg-slate-900 text-emerald-400 p-4 rounded-2xl text-xs font-mono overflow-x-auto shadow-inner border border-slate-800 leading-relaxed"></pre>
                </div>
            `;
        }

        function executeAction(tool, data, prefix) {
            const resBox = document.getElementById(`result-box-${prefix}`);
            const pre = document.getElementById(`output-pre-${prefix}`);
            if (!resBox || !pre) return;

            resBox.classList.remove('hidden');
            
            let mockResponse = {};
            let successMsg = "ดำเนินการประมวลผลเสร็จสิ้น";

            if (tool.id === 1) {
                const orgId = Math.floor(1000 + Math.random() * 9000);
                mockResponse = {
                    status: "success",
                    action: "create_org",
                    org_id: orgId,
                    org_name: data.name || "เทศบาลนครทดสอบ",
                    province: data.province || "กรุงเทพมหานคร",
                    claim_codes: {
                        admin: "ADM-" + Math.random().toString(36).substring(2, 8).toUpperCase(),
                        staff: "STF-" + Math.random().toString(36).substring(2, 8).toUpperCase()
                    },
                    qr_code_url: `https://api.traffy.in.th/qr/org_${orgId}.png`,
                    message: "สร้างหน่วยงานบัญชีทางการและ QR Code สำเร็จ"
                };
                successMsg = `สร้างหน่วยงาน "${data.name || 'ใหม่'}" สำเร็จ!`;
            } else if (tool.id === 2) {
                mockResponse = {
                    status: "success",
                    action: "check_properties",
                    query: data.name || data.org_id || "ทั้งหมด",
                    matched_organizations: [
                        { org_id: data.org_id || 1042, name: data.name || "เทศบาลทดสอบ", flags: { ai: true, public_map: true, cross_forward: true } }
                    ]
                };
                successMsg = "ดึงข้อมูลและสิทธิ์หน่วยงานสำเร็จ";
            } else if (tool.id === 3) {
                mockResponse = {
                    status: "success",
                    action: "check_code",
                    org_id: data.org_id || 1234,
                    admin_claim_code: "ADM-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-XQ",
                    staff_claim_code: "STF-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-BY"
                };
                successMsg = "เรียกดูรหัส Claim Code สำเร็จ";
            } else if (tool.id === 4) {
                mockResponse = {
                    status: "success",
                    action: "update_qr",
                    org_id: data.org_id || 1234,
                    new_qr_url: "https://api.traffy.in.th/storage/qr/updated_" + Date.now() + ".png"
                };
                successMsg = "อัปเดต QR Code ประจำหน่วยงานสำเร็จ";
            } else if (tool.id === 5) {
                mockResponse = {
                    status: "success",
                    action: "create_hierarchy",
                    hierarchy_tag: data.tag || "{bfmcc}",
                    paths_added: data.pathlist ? data.pathlist.split('\n') : ["1", "1.2"]
                };
                successMsg = "สร้างผังองค์กรแม่-ลูกสำเร็จ";
            } else if (tool.id === 6) {
                mockResponse = {
                    status: "success",
                    action: "update_message_state_fi",
                    ticket_id: data.ticket_id || "2026-XXXXXX",
                    new_state: data.state_type || "เสร็จสิ้น"
                };
                successMsg = `ซ่อมเคส ${data.ticket_id || ''} สำเร็จ`;
            } else if (tool.id === 7) {
                mockResponse = {
                    status: "success",
                    action: "view_message_timeline",
                    ticket_id: data.ticket_id || "2026-XXXXXX",
                    timeline: [
                        { state: "start", time: "2026-10-15T08:30:00Z", actor: "Citizen", action: "Reported problem" },
                        { state: "inprogress", time: "2026-10-15T09:15:00Z", actor: "Staff_01", action: "Accepted ticket" }
                    ]
                };
                successMsg = "ดึงรายละเอียดเคสสำเร็จ";
            } else if (tool.id === 8) {
                mockResponse = {
                    status: "success",
                    action: "csv_export",
                    total_rows: Math.floor(Math.random() * 50000) + 10000,
                    download_url: "https://api.traffy.in.th/exports/tickets_" + Date.now() + ".csv"
                };
                successMsg = "สร้างไฟล์ CSV พร้อมดาวน์โหลด";
            } else if (tool.id === 9) {
                mockResponse = {
                    status: "success",
                    action: "bkk_assessment",
                    format: data.output || "json",
                    districts_processed: 50,
                    average_score: (Math.random() * 10 + 85).toFixed(2) + "%"
                };
                successMsg = "คำนวณคะแนนประเมิน กทม. สำเร็จ";
            } else if (tool.id === 11) {
                mockResponse = {
                    status: "success",
                    action: "state_config",
                    org_id: data.org_id || 1234,
                    custom_statuses: ["รออะไหล่", "นัดหมายลงพื้นที่"]
                };
                successMsg = "ตั้งค่า State Config สำเร็จ";
            } else {
                mockResponse = { status: "success", tool_id: tool.id, action: tool.title, input_data: data };
            }

            mockResponse.timestamp = new Date().toISOString();
            
            pre.innerText = JSON.stringify(mockResponse, null, 2);
            showToast(successMsg);

            setTimeout(() => {
                resBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function copyOutput(prefix) {
            const preEl = document.getElementById(`output-pre-${prefix}`);
            if (!preEl) return;
            const text = preEl.innerText;
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast("คัดลอกผลลัพธ์ลงคลิปบอร์ดแล้ว");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 3000);
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const designParam = parseInt(urlParams.get('design'), 10);
            if (designParam >= 1 && designParam <= 5) {
                switchDesign(designParam);
            } else {
                renderApp();
            }
        };
    </script>
</body>
</html>
